<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Credit risk model governance workflow</title>
  <desc id="description">White workflow screenshot showing credit model development, independent validation, committee approval, production monitoring, an append-only model register, and illustrative PD calibration chart.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="34" y="30" width="1132" height="760" rx="24" fill="#ffffff" stroke="#e5eaf1" stroke-width="2"/>
  <text x="66" y="84" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MODEL LIFECYCLE</text>
  <text x="66" y="124" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">From model build to governed decision</text>
  <text x="66" y="155" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Every gate produces evidence; approvals and model versions stay on the audit trail.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="66" y="192" width="230" height="128" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="94" cy="222" r="15" fill="#dbeafe"/>
    <text x="94" y="226" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="700">01</text>
    <text x="86" y="258" fill="#0f172a" font-size="15" font-weight="700">Development</text>
    <text x="86" y="282" fill="#475569" font-size="12">PD / LGD / EAD models</text>
    <text x="86" y="300" fill="#475569" font-size="12">MDD + reproducible data</text>
    <path d="M300 256h22m-7-7 7 7-7 7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="332" y="192" width="230" height="128" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="360" cy="222" r="15" fill="#ffedd5"/>
    <text x="360" y="226" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="700">02</text>
    <text x="352" y="258" fill="#0f172a" font-size="15" font-weight="700">Independent validation</text>
    <text x="352" y="282" fill="#475569" font-size="12">Discrimination + calibration</text>
    <text x="352" y="300" fill="#475569" font-size="12">Stability + challenge tests</text>
    <path d="M566 256h22m-7-7 7 7-7 7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="598" y="192" width="230" height="128" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="626" cy="222" r="15" fill="#dcfce7"/>
    <text x="626" y="226" text-anchor="middle" fill="#15803d" font-size="10" font-weight="700">03</text>
    <text x="618" y="258" fill="#0f172a" font-size="15" font-weight="700">Risk committee</text>
    <text x="618" y="282" fill="#475569" font-size="12">Review findings + limits</text>
    <text x="618" y="300" fill="#475569" font-size="12">Approve or return for change</text>
    <path d="M832 256h22m-7-7 7 7-7 7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="864" y="192" width="270" height="128" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
    <circle cx="892" cy="222" r="15" fill="#ede9fe"/>
    <text x="892" y="226" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">04</text>
    <text x="884" y="258" fill="#0f172a" font-size="15" font-weight="700">Production + monitoring</text>
    <text x="884" y="282" fill="#475569" font-size="12">Track drift and overrides</text>
    <text x="884" y="300" fill="#475569" font-size="12">Revalidate on material change</text>
  </g>
  <rect x="66" y="344" width="1068" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="86" y="374" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">APPEND-ONLY MODEL REGISTER</text>
  <text x="362" y="374" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Version</text>
  <text x="486" y="374" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">•</text>
  <text x="514" y="374" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Evidence hash</text>
  <text x="668" y="374" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">•</text>
  <text x="696" y="374" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Approver + timestamp</text>
  <text x="912" y="374" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">•</text>
  <text x="940" y="374" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Decision trail</text>
  <text x="66" y="436" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Validation view: observed vs predicted default rate</text>
  <text x="66" y="461" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Illustrative calibration buckets • close alignment is desirable; this chart is not a fitted model output</text>
  <rect x="66" y="480" width="1068" height="270" rx="16" fill="#fbfdff" stroke="#e2e8f0"/>
  <g stroke="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b">
    <line x1="160" y1="526" x2="1070" y2="526"/>
    <line x1="160" y1="570" x2="1070" y2="570"/>
    <line x1="160" y1="614" x2="1070" y2="614"/>
    <line x1="160" y1="658" x2="1070" y2="658"/>
    <line x1="160" y1="702" x2="1070" y2="702"/>
    <text x="144" y="530" text-anchor="end" stroke="none">20%</text>
    <text x="144" y="574" text-anchor="end" stroke="none">15%</text>
    <text x="144" y="618" text-anchor="end" stroke="none">10%</text>
    <text x="144" y="662" text-anchor="end" stroke="none">5%</text>
    <text x="144" y="706" text-anchor="end" stroke="none">0%</text>
  </g>
  <polyline points="220,680 390,650 560,612 730,574 900,530 1040,500" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/>
  <polyline points="220,676 390,646 560,618 730,568 900,538 1040,492" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="220" cy="676" r="6"/><circle cx="390" cy="646" r="6"/><circle cx="560" cy="618" r="6"/>
    <circle cx="730" cy="568" r="6"/><circle cx="900" cy="538" r="6"/><circle cx="1040" cy="492" r="6"/>
  </g>
  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">
    <text x="220" y="724">1</text><text x="390" y="724">2</text><text x="560" y="724">3</text>
    <text x="730" y="724">4</text><text x="900" y="724">5</text><text x="1040" y="724">6</text>
  </g>
  <line x1="792" y1="506" x2="824" y2="506" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="832" y="510" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">Predicted</text>
  <line x1="924" y1="506" x2="956" y2="506" stroke="#2563eb" stroke-width="3"/>
  <text x="964" y="510" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">Observed</text>
  <text x="66" y="774" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12">Synthetic illustration • Governance workflow and validation criteria must be tailored and independently approved</text>
</svg>
