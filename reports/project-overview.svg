<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Credit Risk Model and Governance Pack project overview</title>
  <desc id="description">White project overview for a credit risk modelling and governance toolkit with an illustrative expected credit loss scenario chart.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="34" y="30" width="1132" height="760" rx="24" fill="#ffffff" stroke="#e5eaf1" stroke-width="2"/>
  <rect x="66" y="62" width="48" height="48" rx="14" fill="#eaf2ff"/>
  <path d="M77 98V83h8v15m5 0V72h8v26m5 0V86h8v12" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="82" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">QUANT ANALYSIS • MODEL RISK</text>
  <text x="130" y="109" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Credit Risk Model &amp; Governance Pack</text>
  <text x="66" y="166" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Measure expected loss. Keep the evidence.</text>
  <text x="66" y="197" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">PD, LGD and EAD modelling with scenario analysis, validation metrics, and a traceable approval register.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="66" y="226" width="332" height="82" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="86" y="254" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">EXPECTED CREDIT LOSS</text>
    <text x="86" y="286" fill="#1d4ed8" font-size="23" font-weight="700">$6.5M</text>
    <rect x="434" y="226" width="332" height="82" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="454" y="254" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">PD VALIDATION AUROC</text>
    <text x="454" y="286" fill="#15803d" font-size="23" font-weight="700">0.84</text>
    <rect x="802" y="226" width="332" height="82" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="822" y="254" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">MODEL LAYERS</text>
    <text x="822" y="286" fill="#7c3aed" font-size="23" font-weight="700">PD • LGD • EAD</text>
  </g>
  <text x="66" y="352" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Probability-weighted scenario ECL</text>
  <text x="66" y="376" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Illustrative values only • weights shown at left • ECL in USD millions</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="92" y="437" fill="#334155" font-weight="700">Baseline • 40%</text>
    <rect x="294" y="417" width="565" height="28" rx="7" fill="#eff6ff"/>
    <rect x="294" y="417" width="288" height="28" rx="7" fill="#60a5fa"/>
    <text x="878" y="437" fill="#1d4ed8" font-weight="700">$4.8M</text>
    <text x="92" y="492" fill="#334155" font-weight="700">Adverse • 35%</text>
    <rect x="294" y="472" width="565" height="28" rx="7" fill="#eff6ff"/>
    <rect x="294" y="472" width="402" height="28" rx="7" fill="#f59e0b"/>
    <text x="878" y="492" fill="#b45309" font-weight="700">$6.7M</text>
    <text x="92" y="547" fill="#334155" font-weight="700">Severe • 25%</text>
    <rect x="294" y="527" width="565" height="28" rx="7" fill="#eff6ff"/>
    <rect x="294" y="527" width="534" height="28" rx="7" fill="#ef4444"/>
    <text x="878" y="547" fill="#b91c1c" font-weight="700">$8.9M</text>
  </g>
  <rect x="66" y="592" width="1068" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="90" y="624" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">One governed model lifecycle</text>
  <text x="90" y="652" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Estimate PD / LGD / EAD</text>
  <text x="304" y="652" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">→</text>
  <text x="338" y="652" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Validate and stress</text>
  <text x="520" y="652" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">→</text>
  <text x="554" y="652" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Record evidence + approvals</text>
  <text x="822" y="652" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">→</text>
  <text x="856" y="652" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">Reviewable decision</text>
  <text x="66" y="758" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12">Conceptual portfolio summary • All displayed metric values are synthetic and illustrative, not model validation results</text>
</svg>
